<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Territórios</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="top-bar">
    <select id="filtro-grupo">
      <option value="TODOS">Todos os Territórios</option>
    </select>
    <button id="btn-gps" onclick="ativarGPS()">📍 Onde Estou?</button>
  </header>

  <div id="map"></div>

  <div id="painel-detalhes" class="painel oculto">
    <button class="btn-fechar" onclick="fecharPainel()">✕</button>
    <h2 id="detalhe-codigo">---</h2>
    <p><strong>Situação:</strong> <span id="detalhe-status">---</span></p>
    <p><strong>Responsável:</strong> <span id="detalhe-responsavel">---</span></p>
    <hr>
    <div class="painel-acoes">
      <button id="btn-rota" onclick="abrirGoogleMaps()">🗺️ Abrir Maps</button>
      <button id="btn-iniciar" onclick="alterarStatus('Iniciado')">Iniciar</button>
      <button id="btn-concluir" onclick="alterarStatus('Concluído')">Concluir</button>
      <button id="btn-livre" onclick="alterarStatus('Livre')">Liberar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
